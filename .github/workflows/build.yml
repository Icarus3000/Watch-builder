name: Build Watch Face
on:
  push:
    paths:
      - 'watchface.xml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your XML
        uses: actions/checkout@v4
        with:
          path: my-design

      - name: Checkout Android Boilerplate
        uses: actions/checkout@v4
        with:
          repository: android/wear-os-samples
          path: samples

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Custom XML
        run: |
          mkdir -p samples/WatchFaceFormat/SimpleAnalog/watchface/src/main/res/raw
          cp my-design/watchface.xml samples/WatchFaceFormat/SimpleAnalog/watchface/src/main/res/raw/watchface.xml

      - name: Build APK
        working-directory: samples/WatchFaceFormat/SimpleAnalog
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk
          path: samples/WatchFaceFormat/SimpleAnalog/watchface/build/outputs/apk/debug/*.apk
