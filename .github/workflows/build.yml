name: Build Watch Face
on:
  push:
    paths:
      - 'watchface.xml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your XML
        uses: actions/checkout@v4
        with:
          path: my-design

      - name: Checkout Android Boilerplate
        uses: actions/checkout@v4
        with:
          repository: android/wear-os-samples
          path: samples

      - name: Inject Custom XML
        run: |
          mkdir -p samples/WatchFaceFormat/app/src/main/res/raw
          cp my-design/watchface.xml samples/WatchFaceFormat/app/src/main/res/raw/watchface.xml

      - name: Build APK
        working-directory: samples/WatchFaceFormat
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watchface-apk
          path: samples/WatchFaceFormat/app/build/outputs/apk/debug/*.apk
          
